<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title">
  <title id="title">Allerpack – Platzhaltercover</title>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909" />
      <stop offset="0.48" stop-color="#555555" />
      <stop offset="0.49" stop-color="#f1262f" />
      <stop offset="1" stop-color="#c81019" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dy="12" />
      <feComponentTransfer><feFuncA type="linear" slope="0.65" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" rx="80" fill="url(#cover)" />
  <text x="400" y="510" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="360" font-weight="800" filter="url(#shadow)">A</text>
</svg>
